name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android shell
        uses: actions/checkout@v4

      - name: Sync game assets
        env:
          GAME_REPO_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync-wwwroot.sh

          if [ -f app/src/main/assets/assets/index-Bib2eBWV.js ]; then
            echo "Bundled game assets already present."
            exit 0
          fi

          if [ -z "${GAME_REPO_TOKEN:-}" ]; then
            echo "::error::Game bundle missing (index-Bib2eBWV.js). Add repo secret GAME_REPO_TOKEN (PAT with read access to NEXTICON-FC) or sync dist/ into app/src/main/assets/ and push."
            exit 1
          fi

          git clone --depth 1 --branch staging \
            "https://x-access-token:${GAME_REPO_TOKEN}@github.com/dominikca32-maker/NEXTICON-FC.git" \
            game

          corepack enable
          cd game
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          ./scripts/sync-wwwroot.sh game/dist

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Gradle wrapper jar
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Verify bundled game
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/assets/index-Bib2eBWV.js

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NEXTICON-FC-android.apk
          ls -lh NEXTICON-FC-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXTICON-FC-android
          path: NEXTICON-FC-android.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android APK #${{ github.run_number }}
          body: |
            **NEXTICON FC** for Android (WebView shell, debug-signed for sideloading).

            1. Download `NEXTICON-FC-android.apk`
            2. Install on your device (unknown sources / adb)
            3. FlagCDN flags and fonts need network; Event heroes and UI are local.

            CI builds the game from `NEXTICON-FC` staging when `GAME_REPO_TOKEN` is set, or uses committed assets under `app/src/main/assets/`.
          files: NEXTICON-FC-android.apk
          generate_release_notes: false
