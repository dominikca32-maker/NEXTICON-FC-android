    />
    <meta name="theme-color" content="#08090b" />
    <script>
      (function () {
        try {
          var key = "themeId_v1";
          var stored = localStorage.getItem(key) || "midnight";
          var presets = {
            midnight: { mode: "dark", color: "#08090b", vars: { "--app-bg-outer": "#080c14", "--app-bg": "#08090b", "--app-accent": "#2dd4bf" } },
            pitch: { mode: "dark", color: "#071510", vars: { "--app-bg-outer": "#041008", "--app-bg": "#071510", "--app-accent": "#22c55e" } },
            arena: { mode: "dark", color: "#070b14", vars: { "--app-bg-outer": "#050810", "--app-bg": "#070b14", "--app-accent": "#38bdf8" } },
            daylight: { mode: "light", color: "#ececef", vars: { "--app-bg-outer": "#e4e5ea", "--app-bg": "#ececef", "--app-accent": "#117a71" } },
            chalk: { mode: "light", color: "#f0ebe4", vars: { "--app-bg-outer": "#e8e2d9", "--app-bg": "#f0ebe4", "--app-accent": "#b45309" } },
            paper: { mode: "light", color: "#f0eef3", vars: { "--app-bg-outer": "#e6e4eb", "--app-bg": "#f0eef3", "--app-accent": "#6d28d9" } }
          };
          var preset = presets[stored] || presets.midnight;
          var root = document.documentElement;
          root.dataset.theme = stored in presets ? stored : "midnight";
          root.dataset.themeMode = preset.mode;
          Object.keys(preset.vars).forEach(function (name) {
            root.style.setProperty(name, preset.vars[name]);
          });
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", preset.color);
        } catch (e) {}
      })();
    </script>
